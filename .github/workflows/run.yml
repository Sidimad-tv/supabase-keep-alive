name: 3-Hour Supabase Heartbeat

on:
  schedule:
    - cron: '0 */3 * * *' # Runs exactly every 3 hours
  workflow_dispatch: # Allows you to click "Run workflow" to test it manually

jobs:
  ping_and_log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ping Supabase Projects & Write Log
        env:
          SUPABASE_URL_1: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY_1: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_URL_2: ${{ secrets.SUPABASE_URL_1 }}
          SUPABASE_KEY_2: ${{ secrets.SUPABASE_KEY_1 }}
        run: |
          CURRENT_TIME=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "=== Supabase Heartbeat Log ($CURRENT_TIME) ===" > heartbeat.txt

          # Loop through project 1 and project 2 safely
          for i in 1 2; do
            # Dynamically grab variables based on index
            eval URL=\$SUPABASE_URL_$i
            eval KEY=\$SUPABASE_KEY_$i

            if [ -n "$URL" ]; then
              echo "----------------------------------------"
              echo "Pinging Project $i..."
              
              STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$URL/rest/v1/" \
                -H "apikey: $KEY" \
                -H "Authorization: Bearer $KEY")

              echo "Project $i HTTP Status: $STATUS_CODE"
              
              if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 404 ]; then
                echo "Project $i Status: Success ($STATUS_CODE) - Database is Awake!" >> heartbeat.txt
              else
                echo "Project $i Status: Failed ($STATUS_CODE)" >> heartbeat.txt
              fi
            fi
          done

      - name: Commit and Push heartbeat.txt
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add heartbeat.txt
          git diff-index --quiet HEAD || git commit -m "Update heartbeat status for multiple projects [skip ci]"
          git push
